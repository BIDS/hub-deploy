gateway:
  # need to specify each hostname individually on the gateway
  # for cert-manager
  hostnames:
    - biojupyter-hub.bids.berkeley.edu
    - biojupyter-staging.bids.berkeley.edu
    - biojupyter-prometheus.bids.berkeley.edu
    - biojupyter-grafana.bids.berkeley.edu
  config:
    provider:
      kubernetes:
        envoyService:
          annotations:
            # preserve ip when gateway service gets recreated
            cloud.google.com/l4-rbs: "enabled"
            networking.gke.io/load-balancer-ip-addresses: "biojupyter-hub-ingress"
grafana:
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_name: BIDS
      org_role: Viewer
    auth.basic:
      enabled: true
  route:
    main:
      hostnames:
        - biojupyter-grafana.bids.berkeley.edu
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: prometheus
          orgId: 1
          type: prometheus
          url: https://biojupyter-prometheus.bids.berkeley.edu
          isDefault: true
          editable: false
  persistence:
    # 4Gi is minimum for hyperdisk
    size: 4Gi
prometheus:
  server:
    route:
      main:
        hostnames:
          - biojupyter-prometheus.bids.berkeley.edu
