name: deploy
on:
  push:
    branches:
      - main
permissions:
  contents: read
  id-token: write
concurrency: deploy
jobs:
  deploy-staging:
    uses: ./.github/workflows/_deploy_one.yaml
    with:
      cluster_name: biojupyter
      hub_name: biojupyter-staging
      project_id: bids-biojupyter
      workload_identity_provider: projects/520338918604/locations/global/workloadIdentityPools/github/providers/github-actions
  deploy-prod:
    needs:
      - deploy-staging
    strategy:
      matrix:
        include:
          - cluster_name: demo
            hub_name: demo
            project_id: bids-jupyterhub
            workload_identity_provider: projects/579170579029/locations/global/workloadIdentityPools/github/providers/github-actions
          - cluster_name: biojupyter
            hub_name: biojupyter
            project_id: bids-biojupyter
            workload_identity_provider: projects/520338918604/locations/global/workloadIdentityPools/github/providers/github-actions
    uses: ./.github/workflows/_deploy_one.yaml
    with:
      cluster_name: ${{ matrix.cluster_name }}
      hub_name: ${{ matrix.hub_name }}
      project_id: ${{ matrix.project_id }}
      workload_identity_provider: ${{ matrix.workload_identity_provider }}
